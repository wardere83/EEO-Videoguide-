<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | EEO IBP Grant Initiative</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#002F6D">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root { color-scheme: light; --navy:#002F6D; --blue:#0066BA; --gold:#FFB600; --ink:#16202E; --muted:#5A6675; --line:#E4E8EE; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.35rem; padding: 2rem 1.5rem; text-align: center;
      background: #fff; color: var(--ink);
      font-family: 'Source Sans Pro', sans-serif;
    }
    .accent-bar { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: var(--gold); }
    .code { font-size: 0.78rem; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: 0.2em; margin: 0 0 0.6rem; }
    h1 { font-family: 'Crimson Text', serif; margin: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; color: var(--navy); letter-spacing: -0.02em; }
    p.lead { margin: 0.9rem 0 1.8rem; max-width: 460px; color: var(--muted); line-height: 1.55; }
    .home-btn {
      display: inline-block; padding: 0.75rem 1.5rem; border-radius: 999px;
      background: var(--navy); color: #fff; text-decoration: none; font-weight: 600;
    }
    .home-btn:hover { background: #013D78; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="accent-bar"></div>
  <p class="code">Error 404</p>
  <h1>We couldn&rsquo;t find that page</h1>
  <p class="lead">The link may be out of date. Explore the EEO IBP Grant Initiative from the home page.</p>
  <a class="home-btn" href="/">Return to the initiative</a>
</body>
</html>
